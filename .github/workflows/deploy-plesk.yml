name: Deploy Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      protocol:
        description: "FTP protocol (Plesk thường dùng ftp)"
        type: choice
        options:
          - ftp
          - ftps
          - ftps-legacy
        default: ftp

concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Plesk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (standalone)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NODE_ENV: production
        run: |
          export SITE_URL="${SITE_URL:-https://phimngay.top}"
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-$SITE_URL}"
          echo "SITE_URL=$SITE_URL"
          npm run build

      - name: Stage Plesk package
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          APP_PORT: ${{ secrets.PORT }}
        run: |
          set -euo pipefail
          STAGE=.plesk-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.next"

          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            rm -rf .next/standalone/public
            cp -R public .next/standalone/public
          fi

          cp main.js web.config package.json .env.example "$STAGE/"
          cp -R .next/standalone "$STAGE/.next/standalone"

          SITE_URL="${SITE_URL:-https://phimngay.top}"
          NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-$SITE_URL}"
          APP_PORT="${APP_PORT:-3303}"

          cat > "$STAGE/.env" <<EOF
          SITE_URL=${SITE_URL}
          NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
          PORT=${APP_PORT}
          HOSTNAME=0.0.0.0
          NODE_ENV=production
          EOF

          sed -i 's/^[[:space:]]*//' "$STAGE/.env"

          test -f "$STAGE/.next/standalone/server.js"
          test -f "$STAGE/main.js"
          echo "Stage OK"
          du -sh "$STAGE"

      - name: Normalize FTP options
        id: ftp
        env:
          RAW_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          RAW_PROTO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.protocol || vars.FTP_PROTOCOL }}
          RAW_PORT: ${{ vars.FTP_PORT }}
        run: |
          DIR="${RAW_DIR:-./}"
          DIR="${DIR%/}/"
          PROTO="${RAW_PROTO:-ftp}"
          case "$PROTO" in ftp|ftps|ftps-legacy) ;; *)
            echo "Invalid protocol '$PROTO' — dùng ftp|ftps|ftps-legacy"
            exit 1
          esac
          PORT="${RAW_PORT:-21}"
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTO" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "FTP: protocol=$PROTO port=$PORT dir=$DIR"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Plesk Windows: mặc định ftp — ftps hay ECONNRESET data socket
          protocol: ${{ steps.ftp.outputs.protocol }}
          port: ${{ steps.ftp.outputs.port }}
          security: loose
          timeout: 120000
          log-level: standard
          local-dir: .plesk-stage/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          dangerous-clean-slate: false
          # Không exclude node_modules — Next standalone cần .next/standalone/node_modules
          exclude: |
            **/.git*
            **/.git*/**
            **/.env.local
            **/.ftp-deploy-sync-state.json
